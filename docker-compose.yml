version: '3.8'

services:
  # ----------------------------------------------------
  # DỊCH VỤ 1: WEB API (Ứng dụng .NET chính)
  # ----------------------------------------------------
  webapi:
    image: realestatesystem-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5065:8080" # Ánh xạ cổng 5065 ngoài máy thật vào cổng 8080 trong Docker
    depends_on:
      - redis
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # 1. Cấu hình Connection String kết nối Neon PostgreSQL Cloud đọc từ .env
      - DatabaseSettings__Provider=$DB_PROVIDER
      - DatabaseSettings__DefaultConnections=$DB_CONNECTION_STRING
      # 2. Cấu hình Redis Connection kết nối trực tiếp đến Redis container bên dưới
      - Redis__ConnectionString=redis:6379
      # 3. Cấu hình RabbitMq kết nối trực tiếp đến RabbitMq container bên dưới
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - RabbitMq__OtpEmailQueue=otp-email-queue
      # 4. Các thông tin cấu hình nhạy cảm khác đọc an toàn từ file .env
      - Jwt__SecretKey=$JWT_SECRET_KEY
      - Jwt__Issuer=RealEstateSystem
      - Jwt__Audience=RealEstateClient
      - Jwt__AccessToken__ExpirationMinutes=1440
      - Hmac__SecretKey=$HMAC_SECRET_KEY
      - Gemini__ApiKey=$GEMINI_API_KEY
      - Gemini__Model=gemini-2.5-flash
      - Smtp__Host=smtp.gmail.com
      - Smtp__Port=465
      - Smtp__Username=$SMTP_USERNAME
      - Smtp__Password=$SMTP_PASSWORD
      - Smtp__DisplayName=Real Estate System
      - Smtp__EnableSsl=true
      - Smtp__FromEmail=$SMTP_USERNAME
      - Cloudinary__CloudName=$CLOUDINARY_CLOUD_NAME
      - Cloudinary__ApiKey=$CLOUDINARY_API_KEY
      - Cloudinary__ApiSecret=$CLOUDINARY_API_SECRET
      - VnPay__vnp_TmnCode=$VNPAY_TMN_CODE
      - VnPay__vnp_HashSecret=$VNPAY_HASH_SECRET
      - VnPay__vnp_Url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - VnPay__ReturnUrl=http://localhost:3000/payment/vnpay-return
      - VnPay__IpnUrl=http://localhost:5065/api/payment/vnpay-ipn
      - VnPay__Version=2.1.0
      - VnPay__Command=pay
      - VnPay__CurrCode=VND
      - VnPay__Locale=vn
      - AllowedHosts=*

  # ----------------------------------------------------
  # DỊCH VỤ 2: REDIS CACHE
  # ----------------------------------------------------
  redis:
    image: redis:alpine
    container_name: realestatesystem-redis
    ports:
      - "6379:6379"

  # ----------------------------------------------------
  # DỊCH VỤ 3: RABBITMQ MESSAGE BROKER
  # ----------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: realestatesystem-rabbitmq
    ports:
      - "5672:5672"   # Cổng kết nối Message Queue
      - "15672:15672" # Cổng quản lý RabbitMQ Dashboard (Truy cập bằng Web Browser)
